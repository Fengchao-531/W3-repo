[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "source-relocation"
version = "1.0.0"
description = "Reproduction toolkit for source relocation in LLM agents"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "pandas>=2.0", "matplotlib>=3.7", "pyyaml>=6.0"]

[project.optional-dependencies]
agent = ["agentdojo==0.1.35", "openai>=1.0", "anthropic>=0.40", "google-genai>=1.0"]
internal = ["torch>=2.2", "transformers>=4.46", "accelerate>=0.33"]
test = ["pytest>=8"]
browser = ["playwright>=1.48"]

[project.scripts]
source-relocation = "source_relocation.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
